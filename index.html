<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusinessHub58 | Promote Your Business</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #172033;
        }

        .header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e9edf2;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            height: 82px;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo img {
            width: 170px;
            height: auto;
            display: block;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-menu a {
            text-decoration: none;
            color: #172033;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .nav-menu a:hover {
            color: #0a875f;
        }

        .business-btn {
            background: #0a875f;
            color: #ffffff !important;
            padding: 13px 20px;
            border-radius: 7px;
            transition: 0.3s ease;
        }

        .business-btn:hover {
            background: #076b4b;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="nav-container">

            <a href="index.html" class="logo">
                <img src="BusinessHub58%20logo.jpg" alt="BusinessHub58">
            </a>

            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="#">Businesses</a>
                <a href="#">Categories</a>
                <a href="#">Advertise</a>
                <a href="#">Pricing</a>
                <a href="#">About</a>
                <a href="#">Contact</a>

                <a href="#" class="business-btn">List Your Business</a>
            </nav>

        </div>
    </header>

</body>
</html>
